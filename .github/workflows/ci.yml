name: CI

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main, dev]

jobs:

  sp-first-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test del gate SP-FIRST
        run: python3 scripts/tests/check_inline_sql_test.py

      - name: Gate SP-FIRST (SQL inline prohibido)
        run: python3 scripts/check-inline-sql.py

      - name: Test del checker de deriva runtime
        run: python3 scripts/tests/check_runtime_sql_permissions_test.py

      - name: Gate de deriva runtime (Java ↔ grants SQL)
        run: python3 scripts/check-runtime-sql-permissions.py

      - name: Gate de contexto de base en commands SQL
        run: python3 scripts/check-command-database-context.py

  backend:
    runs-on: ubuntu-latest
    needs: sp-first-gate

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Hacer ejecutable gradlew
        run: chmod +x gradlew

      - name: Test
        run: ./gradlew test

      - name: Build
        run: ./gradlew build

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
