services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      APP_DB_URL: ${APP_DB_URL:?APP_DB_URL is required}
      APP_DB_USERNAME: ${APP_DB_USERNAME:?APP_DB_USERNAME is required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:?JWT_EXPIRATION_MINUTES is required}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?APP_CORS_ALLOWED_ORIGINS is required}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
    networks:
      - anexo24
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    ports:
      - "${FRONTEND_PORT:-8088}:8080"
    networks:
      - anexo24
    restart: unless-stopped

networks:
  anexo24:
    driver: bridge
